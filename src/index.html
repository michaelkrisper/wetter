<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wetter</title>
<meta name="description" content="Das Wetter auf einen Blick: auf die Minute genau für die nächsten 90 Minuten, dann stündlich und für 7 Tage.">
<meta name="theme-color" content="#08090c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wetter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://dataset.api.hub.geosphere.at" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="js/config.js">
<link rel="modulepreload" href="js/forecast.js">
<link rel="modulepreload" href="js/regions.js">
<link rel="modulepreload" href="js/borders.js">
<link rel="modulepreload" href="js/model.js">
<link rel="modulepreload" href="js/weather-codes.js">
<link rel="modulepreload" href="js/location.js">
<link rel="modulepreload" href="js/storage.js">
<link rel="modulepreload" href="js/sources/http.js">
<link rel="modulepreload" href="js/sources/open-meteo.js">
<link rel="modulepreload" href="js/sources/geosphere.js">
<link rel="modulepreload" href="js/sources/nominatim.js">
<link rel="modulepreload" href="js/ui/chart.js">
<link rel="modulepreload" href="js/ui/colors.js">
<link rel="modulepreload" href="js/ui/format.js">
<link rel="modulepreload" href="js/ui/icons.js">
<link rel="modulepreload" href="js/ui/render.js">
<script type="module" src="js/main.js"></script>
</head>
<body class="is-empty">
<div class="app">
  <main id="view-weather" class="view-weather">
    <header class="hero">
      <div class="topline">
        <button id="place-btn" class="place" type="button" aria-label="Standort neu bestimmen">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2-7.5Z"/></svg>
          <span id="place">Graz</span>
        </button>
        <span id="status" class="status"></span>
        <button id="reload" class="icon-btn" type="button" aria-label="Aktualisieren">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
      <div class="hero-main">
        <div id="temp" class="hero-temp">–</div>
        <div class="hero-side">
          <div class="hero-cond"><span id="cond-icon"></span><span id="cond">Wetter wird geladen</span></div>
          <dl class="hero-facts">
            <div><dt>Gefühlt</dt><dd id="feels">–</dd></div>
            <div><dt>Wind</dt><dd id="wind">–</dd></div>
            <div><dt>H / T</dt><dd><span id="hi">–</span> / <span id="lo">–</span></dd></div>
            <div><dt>UV</dt><dd id="uv">–</dd></div>
          </dl>
        </div>
      </div>
    </header>

    <section class="card hours" aria-label="Vorhersage">
      <div id="chart-head" class="card-head">
        <h2 id="chart-title">&nbsp;</h2>
        <span id="chart-detail" class="muted"></span>
        <button id="chart-now" class="pill" type="button" hidden>Jetzt</button>
      </div>
      <div id="chart" class="chart" tabindex="0" aria-label="Temperatur, Regen und UV-Index der ganzen Woche, seitlich verschiebbar"></div>
    </section>

    <section class="card days" aria-label="7 Tage">
      <ol id="days"></ol>
    </section>

    <p id="credits" class="credits"></p>
  </main>

  <section id="view-radar" class="view-radar" aria-label="Regenradar" hidden></section>

  <nav class="tabs" aria-label="Ansicht">
    <button type="button" data-tab="weather" aria-selected="true">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19a4 4 0 0 1-.5-7.97 5.5 5.5 0 0 1 10.7-1.03A4 4 0 0 1 17 19Z" transform="translate(1 0) scale(.92)"/><path d="M8 2.8v1.4M3.5 7.5h1.4M4.8 4.3l1 1M11.2 4.3l-1 1"/></svg>
      <span>Wetter</span>
    </button>
    <button type="button" data-tab="radar" aria-selected="false">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 18 6"/></svg>
      <span>Radar</span>
    </button>
  </nav>
</div>
</body>
</html>
