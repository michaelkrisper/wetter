# Weekly updates of GitHub Actions and npm dev tools. Minor and patch updates
# are grouped into one pull request per ecosystem; major updates arrive
# separately. Green Dependabot PRs are merged by dependabot-automerge.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Majors included: separate PRs on the same workflow file block each other's auto-merge.
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
