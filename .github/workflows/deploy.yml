name: Deploy

# Lints the app and publishes src/ to GitHub Pages on every push to main.
# There is no build step: the only change on the way out is stamping the
# commit into the service worker, so each release gets a fresh app cache.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp version
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/" src/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src
      - id: pages
        uses: actions/deploy-pages@v5

      - name: Smoke test
        run: |
          set -euo pipefail
          live="${{ steps.pages.outputs.page_url }}"
          for f in "" sw.js manifest.webmanifest js/main.js icons/icon-192.png; do
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$live$f" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "/$f -> $code"
            [ "$code" = 200 ] || { echo "::error::/$f returned $code"; exit 1; }
          done
          curl -s "${live}sw.js" | grep -q "wetter-${GITHUB_SHA::8}" || { echo "::error::sw.js not stamped"; exit 1; }
