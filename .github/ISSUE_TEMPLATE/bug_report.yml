name: Bug report
description: Something is wrong or looks broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Location
      description: Roughly where were you (city or region)? Data sources depend on it.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, iOS 26, installed as app
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot helps a lot, especially for layout problems.
